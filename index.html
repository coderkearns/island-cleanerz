<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Island Cleanerz</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #196287;
        --secondary: #3ba5ca;
        --accent: #f5af42;
        --text: #1a1e1c;
        --background: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        font-size: calc(min(18px, 2vw) + 0.1rem);
      }

      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Open Sans", sans-serif;
        font-weight: 400;
        color: var(--text);
        background-color: var(--background);
      }

      main {
        display: flex;
        flex-direction: row;
        gap: 3rem;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        justify-content: center;
      }

      img {
        max-width: 30vw;
        /* max-width: 90%; */
        max-height: 300px;
        object-fit: contain;
      }

      /* h1 {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        line-height: 1.1;
        font-size: calc(4vw + 0.1rem);
        overflow-wrap: break-word;
        word-break: break-word;
      } */

      a {
        color: var(--secondary);
        text-decoration: none;
      }

      a:hover,
      a:focus,
      a:active {
        color: var(--accent);
      }

      h2 {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
      }

      .primary {
        color: var(--primary);
        font-weight: 800;
      }

      a.btn {
        margin-top: 1rem;
        background-color: var(--primary);
        color: var(--background);
        padding: 0.5rem 2rem;
        border-radius: 99rem;
        text-align: center;
        text-decoration: none;
        font-size: 1em;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      a.btn:focus,
      a.btn:active {
        background-color: var(--accent);
        outline: none;
      }

      @media (max-width: 600px) {
        body {
          font-size: calc(min(18px, 4vw) + 0.1rem);
        }

        main {
          flex-direction: column;
        }

        section {
          align-items: center;
        }

        img {
          width: 50vw;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <!-- <img src="./favicon.png" alt="The Island Cleanerz" /> -->
        <img src="./logo.png" alt="The Island Cleanerz" />
      </section>
      <section>
        <!-- <h1>THE<br /><span class="primary">ISLAND</span><br />CLEANERZ</h1> -->
        <p>Robert B. Ysawa</p>
        <p><a href="tel:9167171575">(916) 717-1575</a></p>
        <p>
          <a href="mailto:ysawarobert76@gmail.com">ysawarobert76@gmail.com</a>
        </p>
        <h2>Our Services</h2>
        <ul>
          <li>Home and residential cleaning</li>
          <li>Post construction cleaning</li>
          <li>Deep cleaning</li>
          <li>Window cleaning</li>
          <li>Pressure washing</li>
        </ul>
        <a class="btn" href="tel:9167171575">Call to get a quote</a>
      </section>
    </main>
  </body>
</html>
